name: Docker Runtime Validation

on:
  push:
    branches: ["github-first"]
  pull_request:
    branches: ["main", "github-first"]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build             --build-arg DATABASE_URL=postgresql://postgres:postgres@localhost:5432/mb_optica?schema=public             -t mb-optica:ci .
