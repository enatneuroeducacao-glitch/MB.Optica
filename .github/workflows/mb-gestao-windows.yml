name: MB Gestão Windows Installer (Homologation)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "desktop/**"
      - ".github/workflows/mb-gestao-windows.yml"
  push:
    branches: ["main"]
    paths:
      - "desktop/**"
      - ".github/workflows/mb-gestao-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Validate isolated customer installer profile
        env:
          MB_GESTAO_TARGET_URL: https://pilot.example.invalid
          MB_GESTAO_PRODUCT_NAME: MB Gestão - Óptica Piloto
          MB_GESTAO_APP_IDENTIFIER: br.com.mboptica.piloto
          MB_GESTAO_INSTALLER_SLUG: optica-piloto
        run: npm run tauri:validate:customer

      - name: Build Windows NSIS installer
        run: npm run tauri:build

      - name: Upload homologation installer (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: mb-gestao-windows-installer-homologation
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
