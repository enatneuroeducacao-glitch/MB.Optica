[package]
name = "mb-gestao-desktop"
version = "0.1.0"
description = "MB Gestão Inteligente Windows desktop client"
authors = ["MB Óptica"]
edition = "2021"
[lib]
name = "mb_gestao_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2" }
[dependencies]
tauri = { version = "2" }
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
