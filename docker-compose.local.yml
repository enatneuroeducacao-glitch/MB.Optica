services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mb_optica
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d mb_optica"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mb_optica_pgdata:/var/lib/postgresql/data

  migrator:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mb_optica?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mb_optica?schema=public
      AUTH_SECRET: local-development-secret-change-me-32-chars-min
      BOOTSTRAP_TOKEN: local-bootstrap-token-change-me-32-chars
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

volumes:
  mb_optica_pgdata:
